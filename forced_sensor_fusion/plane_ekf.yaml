ekf_filter_node:
  ros__parameters:

    frequency: 50.0
    sensor_timeout: 0.2

    two_d_mode: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link

    world_frame: odom


    # IMU

    imu0: /imu/data

    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      true,  true,  true,
      true,  true,  true
    ]

    imu0_differential: false
    imu0_relative: false

    imu0_remove_gravitational_acceleration: true


    # GPS

    odom0: /odometry/gps

    odom0_config: [
      true,  true,  true,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]

    odom0_differential: false
    odom0_relative: false


    # Barometer

    odom1: /baro/odometry

    odom1_config: [
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]

    odom1_differential: false
    odom1_relative: false